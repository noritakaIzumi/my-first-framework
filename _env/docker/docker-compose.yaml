services:
  httpd:
    build:
      context: httpd
      args:
        - HTTPD_VERSION=${HTTPD_VERSION:-2.4}
    volumes:
      - type: bind
        source: ./htdocs
        target: /usr/local/apache2/htdocs
      - type: bind
        source: ../..
        target: /workspace
      - type: bind
        source: ./httpd/httpd.conf
        target: /usr/local/apache2/conf/httpd.conf
      - type: bind
        source: ./httpd/httpd-vhosts.conf
        target: /usr/local/apache2/conf/extra/httpd-vhosts.conf
    ports:
      - "80:80"
  php:
    build:
      context: php
      args:
        - PHP_VERSION=${PHP_VERSION:-8.1}
        - COMPOSER_BIN_DIR=/workspace/vendor/bin
    volumes:
      - type: bind
        source: ./htdocs
        target: /usr/local/apache2/htdocs
      - type: bind
        source: ../..
        target: /workspace
      - type: bind
        source: ./php/php.ini
        target: /usr/local/etc/php/php.ini
    working_dir: /workspace
  db:
    hostname: host.db
    build:
      context: postgres
      args:
        - VERSION=${POSTGRES_VERSION:-14}
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
